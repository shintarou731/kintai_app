ja:
  activerecord:
    models:
      user: ユーザー
      attendance: 勤怠
      attendance_break: 休憩
      work_rule_setting: 勤務ルール
      approval_request: 申請
      attendance_correction_request: 打刻修正申請
      attendance_correction_break: 申請する休憩
      leave_request: 休暇申請
      leave_cancellation_request: 休暇取消申請
    attributes:
      approval_request:
        user: 申請者
        status: 状態
        target_date: 対象日
        reason: 理由
      leave_request:
        target_date: 開始日
        end_date: 終了日
        leave_type: 休暇の種類
        day_part: 区分
      leave_cancellation_request:
        leave_request: 取り消す休暇
        target_date: 取り消す休暇の開始日
        reason: 取消の理由
      attendance_correction_request:
        clock_in_time: 出勤時刻
        clock_out_time: 退勤時刻
        clock_out_day: 退勤の日付
      attendance:
        work_date: 勤務日
        clock_in_at: 出勤時刻
        clock_out_at: 退勤時刻
      attendance_break:
        started_at: 休憩開始時刻
        ended_at: 休憩終了時刻
      user:
        name: 氏名
        email: メールアドレス
        password: パスワード
        password_confirmation: パスワード（確認）
        current_password: 現在のパスワード
        role: 役割
        employment_type: 雇用区分
        hired_on: 入社日
        active: 状態
      work_rule_setting:
        scheduled_work_time: 1日の所定労働時間
        scheduled_work_minutes: 1日の所定労働時間
        standard_break_time: 標準の休憩時間
        standard_break_minutes: 標準の休憩時間
        closing_day: 締め日
        overtime_warning_hours: 月の残業時間の警告ライン
    errors:
      models:
        attendance_correction_request:
          attributes:
            target_date:
              in_future: に未来の日付は指定できません（今日までの日付を選んでください）
            clock_in_time:
              invalid_time: は「09:00」のように 時:分 で入力してください
              in_future: に未来の時刻は入力できません
              overlaps_previous_day: が前日（%{date}）の勤務の退勤（%{time}）より前です。前日の勤務と重ならない時刻にしてください
            clock_out_time:
              blank_for_past: を入力してください（退勤の打刻を忘れた日は、実際に退勤した時刻を入力してください）
              invalid_time: は「18:00」のように 時:分 で入力してください
              not_after_clock_in: は出勤時刻より後にしてください（日付をまたいで退勤した場合は、日付で「翌日」を選んでください）
              too_long_shift: は出勤から24時間以内にしてください
              in_future: に未来の時刻は入力できません
              overlaps_next_day: が翌日（%{date}）の勤務の出勤（%{time}）より後です。翌日の勤務と重ならない時刻にしてください
            clock_out_day:
              inclusion: は「当日」か「翌日」から選んでください
            base:
              too_many_breaks: 休憩は%{count}回まで入力できます
              break_incomplete: 休憩%{number}の開始時刻と終了時刻を両方入力してください
              break_invalid_time: 休憩%{number}の時刻は「12:00」のように 時:分 で入力してください
              break_not_after_start: 休憩%{number}の終了時刻は開始時刻より後にしてください（日付をまたぐ場合は「翌日」を選んでください）
              break_in_future: 休憩%{number}に未来の時刻は入力できません
              break_outside_work: 休憩%{number}は勤務時間（%{range}）の中に入れてください
              breaks_overlap: 休憩%{first}と休憩%{second}の時間が重なっています
              unchanged: 今の記録と同じ内容です。正しい時刻に直してから申請してください
              duplicate_pending: この日にはすでに承認待ちの修正申請があります。内容を変えたい場合は、その申請を取り下げてから出し直してください
              busy: 他の操作と同時に送信されたため、保存できませんでした。申請の一覧で申請されていないことを確認してから、もう一度「申請する」を押してください
        leave_request:
          attributes:
            target_date:
              too_old: は%{date}以降の日付にしてください（1年より前の休暇は申請できません）
            end_date:
              before_start: は開始日と同じか、開始日より後の日付にしてください
              too_long: までの期間は%{count}日以内にしてください（長い休暇は分けて申請してください）
              too_far: は%{date}までの日付にしてください（1年より先の休暇はまだ申請できません）
            leave_type:
              inclusion: を「有給休暇」「特別休暇」「欠勤」から選んでください
            day_part:
              inclusion: を「全日」「午前半休」「午後半休」から選んでください
              half_day_single_date: が半休のときは、1日だけ指定できます（開始日と終了日を同じ日にしてください）
            base:
              paid_leave_days_off_only: 有給休暇は休日（土日・祝日）を日数に数えないため、休日だけの期間は申請できません（日数が0日になります）
              overlaps: "%{leave}（%{status}）と期間が重なっています。重なる休暇を取り下げるか、取消申請してから申請してください"
              overlaps_concurrent: 同じ時期の休暇の申請が同時に送られたため、申請できませんでした。休暇の一覧を確認してください
              busy: 他の操作と同時に送信されたため、保存できませんでした。休暇の一覧で申請されていないことを確認してから、もう一度「申請する」を押してください
        leave_cancellation_request:
          attributes:
            base:
              not_own_leave: 取り消す休暇が見つかりません
              not_approved: 承認済みの休暇だけ取消申請できます（承認待ちの休暇は、取り下げてください）
              already_cancelled: この休暇はすでに取り消されています
              already_started: 開始日が今日または過去の休暇は、取消申請できません。取消は管理者に依頼してください（管理者が直接取り消します）
              cancellation_pending: この休暇にはすでに承認待ちの取消申請があります
              duplicate_pending: この休暇にはすでに承認待ちの取消申請があります
              busy: 他の操作と同時に送信されたため、保存できませんでした。申請の一覧で申請されていないことを確認してから、もう一度お試しください
        attendance:
          attributes:
            work_date:
              taken: はすでに出勤の記録があります
            clock_out_at:
              before_clock_in: は出勤時刻より後にしてください
        attendance_break:
          attributes:
            started_at:
              before_clock_in: は出勤時刻より後にしてください
            ended_at:
              before_started_at: は休憩開始時刻より後にしてください
        user:
          attributes:
            email:
              taken: はすでに登録されています
            current_password:
              incorrect: が正しくありません
            role:
              cannot_demote_self: は自分自身では従業員に変更できません
            base:
              cannot_deactivate_self: 自分自身を無効にすることはできません
              last_active_admin: 有効な管理者が1人もいなくなるため、この変更はできません
        work_rule_setting:
          negative_duration: はマイナスにできません（0:00 以上で入力してください）
          invalid_duration: は「8:00」のように 時:分 で入力してください（分は 00〜59）
          too_short_duration: は 0:00 より長くしてください
          too_long_duration: は %{max} 以下にしてください（24時間を超える値は設定できません）
          attributes:
            closing_day:
              inclusion: は「月末」「15日」「20日」「25日」から選んでください
      messages:
        record_invalid: "バリデーションに失敗しました: %{errors}"
        restrict_dependent_destroy:
          has_one: "%{record}が存在しているので削除できません"
          has_many: "%{record}が存在しているので削除できません"
  activemodel:
    attributes:
      approval_review:
        decision: 操作
        comment: コメント
      leave_direct_cancellation:
        reason: 取消の理由
    errors:
      models:
        approval_review:
          attributes:
            decision:
              inclusion: は「承認する」か「却下する」を選んでください
            comment:
              blank_for_rejection: を入力してください（却下するときは、理由をコメントに書いてください）
  # 打刻修正申請を承認できない理由（承認する直前に確かめ直す。AttendanceCorrectionRequest#approval_blockers）
  attendance_correction_request:
    approval_blockers:
      kept_clock_out_too_long: 申請した後に記録された退勤（%{clock_out}）が、申請の出勤から24時間を超えるため承認できません
      overlaps_previous_day: 前日（%{date}）の勤務の退勤（%{time}）より前に出勤する内容のため承認できません（前日の勤務と重なります）
      overlaps_next_day: 翌日（%{date}）の勤務の出勤（%{time}）より後に退勤する内容のため承認できません（翌日の勤務と重なります）
      open_ended_with_next_day: 退勤が空欄（勤務中）の申請ですが、翌日（%{date}）に勤務の記録があるため承認できません
  # 休暇申請・取消申請を承認できない理由（承認する直前に確かめ直す）
  leave_request:
    approval_blockers:
      overlaps: 承認済みの %{leave} と期間が重なるため承認できません
      paid_days_off_only: 期間がすべて休日（土日・祝日）のため、有給休暇の日数が0日になり承認できません
    cancellation_blockers:
      already_cancelled: この休暇は取り消されています。
      not_approved: 承認済みの休暇だけ取消申請できます。
      already_started: 開始日が今日または過去の休暇は、取消申請できません。取消は管理者に依頼してください（管理者が直接取り消します）。
      cancellation_pending: この休暇には承認待ちの取消申請があります。
    # 管理者が休暇を直接取り消せない理由（LeaveRequest#direct_cancellation_blockers）
    direct_cancellation_blockers:
      already_cancelled: この休暇はすでに取り消されています。
      not_approved: この休暇は「%{status}」のため取り消せません（承認済みの休暇だけ取り消せます）。
      own_leave: ご自身の休暇は他の管理者が取り消します（有効な管理者が%{count}名いるため、ご自身では取り消せません）。
      closed_period: この休暇は締め済みの月度（%{period}）にかかるため、取り消せません。
  leave_cancellation_request:
    closed_by_direct_cancellation_comment: "%{name} さんが休暇を直接取り消したため、この取消申請は処理済みになりました。"
    approval_blockers:
      already_cancelled: 取り消す休暇は、すでに取り消されています
      not_approved: 取り消す休暇が「%{status}」のため承認できません（承認済みの休暇だけ取り消せます）
  enums:
    leave_request:
      leave_type:
        paid: 有給休暇
        special: 特別休暇
        absence: 欠勤
      leave_type_short:
        paid: 有給
        special: 特別休暇
        absence: 欠勤
      day_part:
        full_day: 全日
        morning: 午前半休
        afternoon: 午後半休
    approval_request:
      status:
        pending: 承認待ち
        approved: 承認済み
        rejected: 却下
        withdrawn: 取り下げ
    user:
      role:
        admin: 管理者
        employee: 従業員
      employment_type:
        full_time: 正社員
        part_time: パート・アルバイト
  errors:
    format: "%{attribute}%{message}"
    messages:
      accepted: を受諾してください
      blank: を入力してください
      confirmation: と%{attribute}の入力が一致しません
      empty: を入力してください
      equal_to: は%{count}にしてください
      even: は偶数にしてください
      exclusion: は予約されています
      greater_than: は%{count}より大きい値にしてください
      greater_than_or_equal_to: は%{count}以上の値にしてください
      in: は%{count}の範囲に含めてください
      inclusion: は一覧にありません
      invalid: は不正な値です
      less_than: は%{count}より小さい値にしてください
      less_than_or_equal_to: は%{count}以下の値にしてください
      model_invalid: "バリデーションに失敗しました: %{errors}"
      not_a_number: は数値で入力してください
      not_an_integer: は整数で入力してください
      odd: は奇数にしてください
      other_than: は%{count}以外の値にしてください
      present: は入力しないでください
      required: を入力してください
      taken: はすでに存在します
      too_long: は%{count}文字以内で入力してください
      too_short: は%{count}文字以上で入力してください
      wrong_length: は%{count}文字で入力してください
      password_too_long: が長すぎます
    template:
      body: 次の項目を確認してください
      header: "%{model}に%{count}個のエラーが発生しました"
  helpers:
    select:
      prompt: 選択してください
    submit:
      create: 登録する
      submit: 保存する
      update: 更新する
  date:
    abbr_day_names: [日, 月, 火, 水, 木, 金, 土]
    abbr_month_names: [~, 1月, 2月, 3月, 4月, 5月, 6月, 7月, 8月, 9月, 10月, 11月, 12月]
    day_names: [日曜日, 月曜日, 火曜日, 水曜日, 木曜日, 金曜日, 土曜日]
    formats:
      default: "%Y/%m/%d"
      long: "%Y年%-m月%-d日(%a)"
      short: "%-m/%-d"
      short_with_day: "%-m/%-d(%a)"
      month_day_with_day: "%-m月%-d日(%a)"
    month_names: [~, 1月, 2月, 3月, 4月, 5月, 6月, 7月, 8月, 9月, 10月, 11月, 12月]
    order: [year, month, day]
  time:
    am: 午前
    pm: 午後
    formats:
      default: "%Y/%m/%d %H:%M"
      long: "%Y年%-m月%-d日(%a) %H:%M"
      short: "%-m/%-d %H:%M"
      time: "%H:%M"
